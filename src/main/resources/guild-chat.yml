id: guild
enabled: true
display: <gold>Guild
format: <gray>[<yellow>{guild}<gray>] <white>{rank} {name} ➻ {message}</white>

commands:
  - guildchat

requirements:
  - "PERMISSION:chatchannel.guild"

ping:
  enable: true
  cooldown: 10
  sound:
    sound: entity.experience_orb.pickup
    volume: 3
    pitch: 1